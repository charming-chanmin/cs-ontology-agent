<title>개념 지도 학습 코치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 머리(과목·탭) → 한 화면씩(길잡이 / 문제 / 강의 / 지도). 폰 기준 한 줄, 넓으면 지도만 2단.
   색: 개념 상태 4가지(앎·확인 중·모름·안 봄)에만 쓰고, 색마다 기호(✓ ◐ ✗ ○)와 글자를 같이 붙인다. 강의 본문 색 규칙은 스토리 강의 그대로. */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --ink:#191B22; --muted:#5B5F6E; --line:#DCDFE8; --soft:#EEF0F5;
  --quiz:#F0F2F7; --bridge:#FFFDF5; --bridge-line:#C9B98A;
  --spoil:#F6F1FF; --spoil-line:#9A86D6; --hist:#F3F7F2; --hist-line:#8FB08A; --ex:#F2F7FC; --ex-line:#8EAFD3;
  --s1:#C8302B; --s2:#C95A0A; --s3:#9A7000; --s4:#1F7F36; --s5:#1D5BCB; --s6:#3A33A3; --s7:#8A2CAD;
  --r-soft:#FCE9E8; --b-soft:#E6EEFD; --ok:#1F7F36; --no:#C8302B;
  --k-def:#191B22; --k-role:#1D5BCB; --k-goal:#1F7F36; --k-how:#C95A0A; --k-term:#5B5F6E;
  --st-know:#1F7F36; --st-half:#9A6400; --st-unknown:#C8302B; --st-none:#7A8091; --st-none-bar:#C9CDD8;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#181B22; --ink:#E6E8EF; --muted:#9A9FB0; --line:#2B2F3A; --soft:#20242D;
  --quiz:#1E222B; --bridge:#1F1D16; --bridge-line:#6E6243;
  --spoil:#1E1B2B; --spoil-line:#6E62A8; --hist:#17201A; --hist-line:#4F7049; --ex:#16202B; --ex-line:#4C6B8F;
  --s1:#FF7C72; --s2:#FFA25A; --s3:#F2C94C; --s4:#66D486; --s5:#7BAEFF; --s6:#A29EFF; --s7:#DB8DFF;
  --r-soft:#3A1F1E; --b-soft:#19253C; --ok:#66D486; --no:#FF7C72;
  --k-def:#E6E8EF; --k-role:#7BAEFF; --k-goal:#66D486; --k-how:#FFA25A; --k-term:#9A9FB0;
  --st-know:#5BCB82; --st-half:#E8B04A; --st-unknown:#FF7C72; --st-none:#8E94A6; --st-none-bar:#3A3F4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#181B22; --ink:#E6E8EF; --muted:#9A9FB0; --line:#2B2F3A; --soft:#20242D;
  --quiz:#1E222B; --bridge:#1F1D16; --bridge-line:#6E6243;
  --spoil:#1E1B2B; --spoil-line:#6E62A8; --hist:#17201A; --hist-line:#4F7049; --ex:#16202B; --ex-line:#4C6B8F;
  --s1:#FF7C72; --s2:#FFA25A; --s3:#F2C94C; --s4:#66D486; --s5:#7BAEFF; --s6:#A29EFF; --s7:#DB8DFF;
  --r-soft:#3A1F1E; --b-soft:#19253C; --ok:#66D486; --no:#FF7C72;
  --k-def:#E6E8EF; --k-role:#7BAEFF; --k-goal:#66D486; --k-how:#FFA25A; --k-term:#9A9FB0;
  --st-know:#5BCB82; --st-half:#E8B04A; --st-unknown:#FF7C72; --st-none:#8E94A6; --st-none-bar:#3A3F4B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;margin:0;overflow-wrap:break-word;word-break:keep-all}
.ap-wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 72px}
.ap-narrow{max-width:740px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.ap-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.ap-eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ap-top h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.6vw,2.2rem)}
.ap-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.ap-seg button{font:inherit;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer;min-height:40px}
.ap-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ap-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:6px;z-index:5}
.ap-tabs a{text-align:center;text-decoration:none;color:var(--muted);font-size:.95rem;padding:8px 4px;border-radius:9px;white-space:nowrap}
.ap-tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.ap-tabs a:focus-visible,.ap-seg button:focus-visible,.ap-btn:focus-visible,.ap-opt:focus-visible,.ap-tile:focus-visible,.ap-link:focus-visible,.ap-chip:focus-visible,.ap-filter button:focus-visible{outline:2px solid var(--s5);outline-offset:2px}
.ap-h2{font-family:var(--display);font-weight:400;font-size:1.6rem}
.ap-h3{font-size:.95rem;font-weight:700;margin:0 0 8px}
.ap-muted{color:var(--muted)} .ap-small{font-size:.86rem}
.ap-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;min-width:0}
.ap-card.em{border:2px solid var(--ink)}
.ap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ap-btn{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;text-align:left}
.ap-btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ap-btn.sm{min-height:36px;padding:4px 11px;font-size:.85rem;border-radius:8px}
.ap-btn:disabled{opacity:.5;cursor:default}
.ap-link{color:var(--s5);text-decoration:none;font-weight:600}
/* 상태: 색 + 기호 + 글자 */
.s-know{--c:var(--st-know)} .s-half{--c:var(--st-half)} .s-unknown{--c:var(--st-unknown)} .s-none{--c:var(--st-none)}
.ap-ic{color:var(--c);font-weight:700;font-style:normal;display:inline-block;min-width:1em;text-align:center}
.ap-st{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;color:var(--c);border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:999px;padding:0 9px;white-space:nowrap;line-height:1.7}
.ap-role{font-size:.76rem;font-weight:700;border-radius:999px;padding:0 8px;white-space:nowrap;border:1px dashed var(--st-unknown);color:var(--st-unknown)}
.ap-role.start{border-style:solid;background:var(--st-unknown);color:var(--surface)}
.ap-chip{display:inline-flex;align-items:center;gap:3px;max-width:100%;text-decoration:none;color:var(--ink);font-size:.86rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 10px 1px 7px;line-height:1.6}
.ap-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ap-hist{font-family:var(--mono);font-size:.82rem;letter-spacing:.06em}
.ap-hist .y{color:var(--st-know)} .ap-hist .n{color:var(--st-unknown)}
.ap-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:8px 0}
.ap-stack i{display:block;height:100%}
.ap-stack .s-know{background:var(--st-know)} .ap-stack .s-half{background:var(--st-half)} .ap-stack .s-unknown{background:var(--st-unknown)} .ap-stack .s-none{background:var(--st-none-bar)}
.ap-defs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.ap-defs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;font-size:.88rem}
.ap-defs .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);margin-left:4px}
.ap-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.ap-bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.ap-bar i{display:block;height:100%}
.ap-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ap-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ap-cname{display:flex;align-items:center;min-width:0;gap:6px}
.ap-cname > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-num{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ap-stats{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:6px}
.ap-stat b{display:block;font-family:var(--mono);font-size:1.5rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.ap-stat span{font-size:.8rem;color:var(--muted)}
.ap-path{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.88rem;margin:6px 0}
.ap-path .arr{color:var(--muted)}
.ap-badge{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.ap-badge.chk{color:var(--s5);border-color:color-mix(in srgb,var(--s5) 50%,var(--line))}
.ap-badge.ai{color:var(--s7);border-color:color-mix(in srgb,var(--s7) 50%,var(--line))}
/* 길잡이 */
.ap-guide{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ap-guide:first-of-type{border-top:0;padding-top:0}
.ap-ghead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ap-ghead b{font-size:1.02rem}
.ap-steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;counter-reset:st}
.ap-steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;font-size:.9rem;counter-increment:st}
.ap-steps li::before{content:counter(st);font-family:var(--mono);font-size:.78rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;margin-top:2px}
.ap-steps li.done::before{content:"✓";background:var(--st-know);border-color:var(--st-know);color:var(--surface)}
.ap-steps .ap-row{margin-top:4px}
.ap-rule{font-size:.86rem;background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0}
/* 문제 */
.ap-prog{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.ap-prog .ap-bar i{background:var(--ink)}
.ap-q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.ap-q.check{border:2px solid var(--s5)}
.ap-why{font-size:.9rem;background:var(--b-soft);color:var(--ink);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.ap-qc{font-size:.84rem;color:var(--muted);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ap-q .qtext{font-weight:700;margin:4px 0 10px;font-size:1.04rem}
.ap-q blockquote{margin:6px 0 10px;padding:8px 12px;border-left:3px solid var(--s3);background:var(--quiz);border-radius:0 6px 6px 0}
.ap-opts{display:grid;gap:8px;margin-top:10px}
.ap-opt{font:inherit;font-size:.97rem;text-align:left;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:48px}
.ap-opt b{font-family:var(--mono);color:var(--muted);font-weight:600}
.ap-opt:hover{border-color:var(--ink)}
.ap-opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.ap-opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--surface))}
.ap-opt.off{opacity:.55}
.ap-opt[aria-disabled="true"]{cursor:default}
.ap-opt[aria-disabled="true"]:hover{border-color:var(--line)} .ap-opt.ok[aria-disabled="true"]:hover{border-color:var(--ok)} .ap-opt.bad[aria-disabled="true"]:hover{border-color:var(--no)}
.ap-ta{width:100%;min-height:84px;font:inherit;font-size:.97rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.ap-ta:focus-visible{outline:2px solid var(--s5);outline-offset:1px}
.ap-fb{border-radius:10px;padding:12px 14px;margin-top:12px;border:1.5px solid var(--line);background:var(--surface)}
.ap-fb.ok{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))} .ap-fb.bad{border-color:color-mix(in srgb,var(--no) 60%,var(--line))}
.ap-fb h4{margin:0 0 4px;font-size:1rem}
.ap-fb .lec{font-size:.94rem}
.ap-trans{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:.9rem}
.ap-trans li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ap-trans .hint{color:var(--muted);font-size:.84rem}
.ap-probe{border-radius:10px;padding:10px 12px;margin-top:12px;background:color-mix(in srgb,var(--s5) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--s5) 55%,var(--line));font-size:.93rem}
.ap-probe p{margin:4px 0 0}
.ap-ai{border-radius:10px;padding:10px 12px;margin-top:12px;border:1.5px dashed color-mix(in srgb,var(--s7) 60%,var(--line))}
.ap-ai .out{white-space:pre-wrap;font-size:.94rem;margin-top:8px}
.ap-ai input{font:inherit;font-size:.94rem;flex:1 1 200px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ap-trace{font-family:var(--mono);font-size:.74rem;color:var(--muted);white-space:pre-wrap;margin-top:6px}
.ap-modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ap-mode{text-align:left;font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.ap-mode b{font-size:1rem} .ap-mode span{font-size:.85rem;color:var(--muted)}
.ap-mode:hover{border-color:var(--ink)}
.ap-mode:disabled{opacity:.5;cursor:default}
select.ap-sel{font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:42px;max-width:100%;min-width:0;flex:1 1 200px}
/* 강의 */
.ap-lessons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ap-lcard{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:2px 12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ap-lcard:hover{border-color:var(--ink)}
.ap-lcard .n{grid-row:1/4;font-family:var(--display);font-size:1.5rem;align-self:center}
.ap-lcard .t{font-weight:700}
.ap-lcard .m{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.ap-scene{margin-top:34px;scroll-margin-top:64px}
.ap-stag{display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:.74rem;font-weight:600;background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:999px;max-width:100%;flex-wrap:wrap}
.ap-scene h3{font-family:var(--display);font-weight:400;font-size:1.45rem;margin-top:8px}
.ap-sfoot{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;display:grid;gap:8px}
.ap-lhead{border-bottom:3px solid var(--ink);padding-bottom:12px}
.ap-lhead h2{font-family:var(--display);font-weight:400;font-size:1.75rem}
/* 지도 */
.ap-maplay{display:grid;gap:16px}
.ap-maplay > *{min-width:0}
@media (min-width:900px){.ap-maplay{grid-template-columns:minmax(0,1fr) 400px;align-items:start}.ap-side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}}
.ap-filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ap-filter button{font:inherit;font-size:.84rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:4px}
.ap-filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ap-filter button[aria-pressed="true"] .ap-ic{color:inherit}
.ap-ch{margin:14px 0 6px;font-size:.84rem;font-weight:700;color:var(--muted)}
.ap-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.ap-tile{font:inherit;font-size:.82rem;text-align:left;line-height:1.35;padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--ink);border:1.5px solid var(--line);background:var(--surface);min-height:70px;display:grid;align-content:start;gap:2px;min-width:0}
.ap-tile .id{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.ap-tile .sl{font-size:.74rem;font-weight:700;color:var(--c)}
.ap-tile[aria-current="true"]{outline:2.5px solid var(--ink);outline-offset:1px}
.ap-tile.s-know,.ap-tile.s-half,.ap-tile.s-unknown{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:var(--c)}
.ap-tile.start{box-shadow:inset 0 0 0 2px var(--st-unknown)}
.ap-gwrap{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.ap-graph{display:block;margin:0 auto;max-width:none}
.ap-graph text{font-family:var(--sans);font-size:11.5px;fill:var(--ink)}
.ap-graph .e{fill:none;stroke:var(--muted);stroke-width:1.3}
.ap-graph .e.hot{stroke:var(--st-unknown);stroke-width:2.4}
.ap-graph .n rect{stroke-width:1.5}
.ap-graph .n.sel rect{stroke:var(--ink);stroke-width:3}
.ap-graph .n.start rect{stroke-dasharray:5 3;stroke-width:2.6}
.ap-graph .n{cursor:pointer}
.ap-cardk dl{margin:0;display:grid;gap:8px} .ap-cardk dt{font-size:.76rem;color:var(--muted);font-weight:700} .ap-cardk dd{margin:2px 0 0;font-size:.93rem}
.ap-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.88rem;margin:8px 0}
.ap-kv dt{color:var(--muted);font-weight:700;font-size:.8rem;padding-top:2px} .ap-kv dd{margin:0}
.ap-foot{margin-top:28px;border-top:1px solid var(--line);padding-top:12px;font-size:.82rem;color:var(--muted)}
.ap-hidden{display:none!important}
.lec p.note{font-size:.88rem;color:var(--muted);margin:6px 0}
.gen-svg{display:block;max-width:100%;height:auto;margin:8px auto;color:var(--ink)}
.ap-okc{color:var(--ok);font-weight:700} .ap-noc{color:var(--no);font-weight:700}
.ap-fb details,.ap-card details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.ap-fb summary,.ap-card summary{cursor:pointer;color:var(--s5);font-weight:700}
@media (prefers-reduced-motion:no-preference){.ap-opt,.ap-btn,.ap-tile,.ap-mode{transition:border-color .15s,background-color .15s}}
/*__LECTURE_CSS__*/
</style>

<div class="ap-wrap">
  <header class="ap-top">
    <div><div class="ap-eyebrow">Ontology Learning Coach</div><h1>개념 지도 학습 코치</h1></div>
    <div class="ap-seg" role="group" aria-label="과목" id="subjSeg"></div>
  </header>
  <nav class="ap-tabs" aria-label="화면" id="tabs"></nav>
  <main id="view"></main>

  let svg = `<svg class="ap-graph" width="${Math.ceil(gi.width)}" height="${Math.ceil(gi.height)}" viewBox="0 0 ${Math.ceil(gi.width)} ${Math.ceil(gi.height)}" role="img" aria-label="${esc(c.title)}의 선행 개념 그래프"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>`;
  for(const [a, b] of edges){ const pts = g.edge(String(a), String(b)).points; const hot = statusOf(st, a) === 'unknown' && statusOf(st, b) === 'unknown';
    svg += `<path class="e${hot ? ' hot' : ''}" marker-end="url(#ar)" d="M${pts.map(p => `${p.x},${p.y}`).join('L')}"/>`; }
  for(const x of ids){ const p = g.node(String(x)), s = statusOf(st, x);
    svg += `<g class="n${x === id ? ' sel' : ''}${roleOf(key, st, x) === 'start' ? ' start' : ''}" data-cid="${x}" transform="translate(${p.x - p.width / 2},${p.y - 14})"><title>${esc(cname(key, x))}: ${STATUS[s].label}</title><rect width="${p.width}" height="28" rx="6" fill="${fill(x)}" stroke="var(--st-${s})"/><text x="8" y="18">${esc(label(x))}</text></g>`; }
  box.innerHTML = svg + '</svg>';
  box.querySelectorAll('[data-cid]').forEach(n => n.addEventListener('click', () => go(`#/${key}/map/${n.dataset.cid}`)));
}

<script>
// ── AI (Claude 안에서 열 때만: sample 캡빌리티) ──
const AI = {ok:false, s:null};
const sampleP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
sampleP.then(s => { AI.s = s; AI.ok = !!s; if(s && typeof render === 'function') render(); });
const AI_ERR = {not_granted:'Claude 사용을 허용하지 않아서 AI 기능을 쓸 수 없어.', sampling_disabled:'이 계정에서는 Claude를 쓸 수 없어.', rate_limited:'요청이 많아. 잠시 뒤에 다시 해 줘.', session_expired:'다시 로그인해야 해.', refused:'이 요청에는 답할 수 없대.', empty_completion:'답이 비었어. 다시 해 줘.', upstream_error:'연결이 끊겼어. 다시 해 줘.', invalid_json:'AI 답을 읽지 못했어. 다시 해 줘.'};
const aiErr = e => AI_ERR[e && e.code] || '잠깐 문제가 생겼어. 다시 해 줘.';
function aiOff(e){ if(e && (e.code === 'not_granted' || e.code === 'sampling_disabled')){ AI.ok = false; render(); } }
const TUTOR = '너는 독학사 컴퓨터공학 1:1 과외 선생이야. 학생은 자바를 쓰는 초급 개발자야. 반말로, 짧고 쉽게, 옛날 방식의 문제 → 그래서 나온 개념 흐름으로 설명해. 아래 자료에 없는 사실은 지어내지 마. 모르면 모른다고 해. 학생 상태는 앎(2번 연속 맞힘)·확인 중(1번 맞힘)·모름(마지막에 틀림)·안 봄으로 표시돼. 확률이나 퍼센트로 말하지 마.';
function conceptContext(key, cid){
  const {data, ix} = S(key), st = store.load(key), c = ix.byId.get(cid), sid = sceneOf(key, cid), sc = sid ? data.scenes[sid] : null;
  const S_ = id => STATUS[statusOf(st, id)].label;
  return `[개념 #${c.id} ${c.title}]\n왜 필요한가: ${c.why}\n핵심: ${c.core}\n선행: ${c.prereq.filter(ix.live).map(p => `${cname(key, p)}(${S_(p)})`).join(', ') || '없음'}\n학생 상태: ${S_(cid)} — ${stateLine(st, cid, now())}` + (sc ? `\n[강의 발췌: ${sc.title}]\n${sc.text}` : '');
}
function questionContext(q, choice, text){
  const strip = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  let s = `[문제] ${q.question_text || strip(q.stem)}`;
  if(q.kind === 'mcq') s += `\n[보기] ${q.options.map((o, i) => `${i + 1}) ${strip(o)}`).join(' / ')}\n[정답] ${q.answer.join(', ')}\n[학생이 고른 답] ${choice != null ? choice + 1 : '없음'}\n[보기 해설] ${Object.entries(q.expl || {}).map(([k, v]) => `${k}: ${strip(v)}`).join(' / ')}`;
  else s += `\n[모범답안] ${q.answer_text}\n[학생 답] ${text || '(안 씀)'}`;
  if(q.extra) s += `\n[풀이] ${strip(q.extra).slice(0, 900)}`;
  return s;
}
// 주관식·계산 채점
async function aiGrade(key, q, text){
  const prompt = `${TUTOR}\n지금은 채점자 역할이야. 모범답안과 풀이를 기준으로 학생 답을 채점해. 표기가 달라도 뜻이 같으면 맞음. 계산 문제는 최종 답을 먼저 보고, 풀이가 있으면 어디서 틀렸는지 짚어.\nJSON 하나로만 답해: {"score": 0~10 정수, "correct": 7점 이상이면 true, "missing": ["빠진 핵심어"], "feedback": "한두 문장"}\n\n${questionContext(q, null, text)}`;
  return AI.s.json(prompt, {modelTier:'quick', cache:false});
}
// AI 질문 상자 (문제 피드백 안)
function aiBoxHtml(){
  return `<div class="ap-ai"><div class="ap-small"><b>AI 튜터</b> · 이 문제와 개념 자료만 근거로 답해</div><div class="out" id="aiOut">${esc(SES.ai.out || '')}</div>
    <div class="ap-row" style="margin-top:8px"><input id="aiQ" placeholder="더 묻고 싶은 것 (예: 왜 ②가 아니야?)" aria-label="AI에게 질문"><button class="ap-btn sm" id="aiSend">묻기</button></div></div>`;
}
async function askTutor(question){
  const key = SES.key, {data} = S(key), q = data.quizzes[SES.cur.qid];
  SES.ai = SES.ai || {msgs:[], out:''};
  const first = !SES.ai.msgs.length;
  const content = first ? `${TUTOR}\n\n${conceptContext(key, q.concepts[0])}\n\n${questionContext(q, SES.choice, SES.text)}\n\n학생 질문: ${question}` : question;
  SES.ai.msgs.push({role:'user', content});
  const out = $('#aiOut'); if(out) out.textContent = '생각하는 중…';
  try{
    const {text} = await AI.s(SES.ai.msgs, {modelTier:'default', cache:false, onText:({text}) => { const o = $('#aiOut'); if(o) o.textContent = text; }});
    SES.ai.msgs.push({role:'assistant', content:text}); SES.ai.out = text;
  }catch(e){ SES.ai.msgs.pop(); SES.ai.out = (e.text || '') + '\n' + aiErr(e); aiOff(e); }
  const o = $('#aiOut'); if(o) o.textContent = SES.ai.out;
}
// AI 새 문제 (개념 자료에 근거, 형식 검사 통과한 것만 낸다)
async function aiNewQuestion(key, cid){
  const {data} = S(key);
  const prompt = `${TUTOR}\n아래 개념 자료만 근거로 독학사 시험 스타일의 4지선다 문제 1개를 새로 만들어. 개념을 제대로 이해했는지 묻는 문제로. 정답은 하나. 보기마다 왜 맞고 틀린지 한 줄 해설.\nJSON 하나로만 답해: {"stem": "문제", "options": ["보기1","보기2","보기3","보기4"], "answer": 1~4, "explanations": ["보기1 해설","보기2 해설","보기3 해설","보기4 해설"]}\n\n${conceptContext(key, cid)}`;
  const r = await AI.s.json(prompt, {modelTier:'default', cache:false});
  if(!r || typeof r.stem !== 'string' || !Array.isArray(r.options) || r.options.length !== 4 || !(r.answer >= 1 && r.answer <= 4) || !Array.isArray(r.explanations) || r.explanations.length < 4 || new Set(r.options.map(String)).size !== 4) throw {code:'invalid_json'};
  const id = `ai-${key}-${cid}-${Date.now()}`;
  data.quizzes[id] = {id, kind:'mcq', src:'AI가 개념 자료로 만든 문제', ai:true, concepts:[cid], scene:sceneOf(key, cid), pub:true, weight:null, adhoc:true,
    stem:`<p class="qtext">${esc(r.stem)}</p>`, options:r.options.map(o => esc(o)), answer:[Math.round(r.answer)], tail:'', extra:'',
    expl:Object.fromEntries(r.explanations.slice(0, 4).map((e, i) => [String(i + 1), esc(e)])), question_text:r.stem};
  return id;
}
// 길잡이 화면의 AI 코치: 도구로 학습 기록과 온톨로지를 직접 조회한다
function aiCoachHtml(){
  if(!AI.ok) return '';
  return `<div class="ap-card"><div class="ap-h3">AI 코치</div><p class="ap-small ap-muted" style="margin:0 0 8px">Claude가 네 기록과 개념 지도를 도구로 직접 조회해서 오늘 할 일을 정해 줘. 누른 사람의 Claude 사용량을 써.</p><button class="ap-btn" id="coachRun">오늘 계획 받기</button><div class="ap-trace" id="coachTrace"></div><div class="ap-ai ap-hidden" id="coachBox"><div class="out" id="coachOut"></div></div></div>`;
}
async function runCoach(){
  const key = route.subj, st = store.load(key), {data, ix} = S(key), t = now(), btn = $('#coachRun'), tr = $('#coachTrace'), out = $('#coachOut');
  btn.disabled = true; $('#coachBox').classList.remove('ap-hidden'); out.textContent = '생각하는 중…'; tr.textContent = '';
  const log = s => { tr.textContent += '→ ' + s + '\n'; };
  const T = id => ({id, title:cname(key, id), status:STATUS[statusOf(st, id)].label});
  const tools = [
    {name:'get_progress', description:'학생의 전체 진도: 푼 문제 수, 상태별 개념 수(앎·확인 중·모름·안 봄), ★5 핵심 중 앎, 복습할 때 된 개념 수.', execute:() => { log('get_progress()'); const r = recommend(ix, st, t); return {attempts:st.attempts.length, counts:Object.fromEntries(STATUS_KEYS.map(s => [STATUS[s].label, r.count[s]])), core_know:`${r.coreKnow}/${r.coreTotal}`, due:r.due.length}; }},
    {name:'get_guide', description:'모르는 개념 길잡이: 출발점(모름인데 선행에 모름 없음)마다, 그걸 알면 이어서 풀리는 모름 개념과 아직 확인 안 된 선행.', execute:() => { log('get_guide()'); return recommend(ix, st, t).guide.starts.slice(0, 6).map(s => ({...T(s.id), unlocks:s.unlocks.slice(0, 6).map(T), unchecked_prereq:s.unchecked.map(T)})); }},
    {name:'get_half_and_due', description:'한 번 더 맞히면 앎인 개념(확인 중)과 복습할 때 된 개념.', execute:() => { log('get_half_and_due()'); const r = recommend(ix, st, t); return {half:r.half.slice(0, 8).map(T), due:r.due.slice(0, 8).map(T)}; }},
    {name:'get_recent_mistakes', description:'최근 틀린 문제 10개의 개념과 날짜.', execute:() => { log('get_recent_mistakes()'); return st.attempts.filter(a => !a.ok).slice(-10).map(a => ({concept:T(a.c[0]), check:a.chk != null, date:new Date(a.t).toISOString().slice(0, 10)})); }},
    {name:'get_concept', description:'개념 하나의 정의, 상태와 근거, 선행 개념(각 상태), 관련 강의 장면.', inputSchema:{type:'object', properties:{id:{type:'integer'}}, required:['id']},
      execute:({id}) => { log(`get_concept(${id})`); const c = ix.byId.get(Number(id)); if(!c) throw new Error('없는 개념이야'); return {...T(c.id), basis:stateLine(st, c.id, t), why:c.why, core:c.core.slice(0, 300), prereq:c.prereq.filter(ix.live).map(T), lecture:c.scenes.map(s => `${data.scenes[s].lesson}강 ${data.scenes[s].title}`)}; }},
  ];
  const prompt = `${TUTOR}\n과목: ${data.name}. 도구로 학생 기록과 개념 지도를 조회해서 오늘 할 일을 정해. get_progress → get_guide → get_half_and_due 순서로 보고, 필요하면 get_concept.\n기록이 거의 없으면 진단부터 하라고 해. 형식:\n지금 상태: 한두 줄\n오늘 순서: 최대 4단계, 각 줄 "개념 — 무엇을 할지(강의/확인 문제/선행 확인) — 이유"\n한마디: 한 줄`;
  try{ const {text} = await AI.s(prompt, {tools, modelTier:'default', cache:false, onText:({text}) => { out.textContent = text; }}); out.textContent = text; }
  catch(e){ out.textContent = (e.text || '') + '\n' + aiErr(e); aiOff(e); }
  btn.disabled = false;
}

<script>
// ── 그리기 ──
function renderTop(){
  $('#subjSeg').innerHTML = SUBJECTS.map(k => `<button data-subj="${k}" aria-pressed="${route.subj === k}">${esc(S(k).data.short)}</button>`).join('');
  $('#tabs').innerHTML = [['today','길잡이'],['quiz','문제'],['lec','강의'],['map','지도']].map(([v, l]) => `<a href="#/${route.subj}/${v}"${route.view === v ? ' aria-current="page"' : ''}>${l}${v === 'quiz' && SES && SES.key === route.subj && SES.phase !== 'done' ? ' •' : ''}</a>`).join('');
}
function renderFoot(){
  $('#foot').innerHTML = `${store.err ? '마지막 저장이 실패했어. 다시 풀면 다시 저장해.<br>' : ''}상태는 그 개념 문제를 직접 푼 기록으로만 정해: 2번 연속 맞히면 앎, 1번 맞히면 확인 중, 마지막에 틀리면 모름. 선행 관계(무엇을 먼저 알아야 하는지)는 개념 온톨로지에서 와. 문제는 개념 규격에서 만드는 문제, 숫자를 바꿔 만드는 계산 문제, 강의 속 문제로 이뤄져 있어. 통컴시 개념 147개의 전체 선행 관계 그래프는 <a class="ap-link" href="https://charming-chanmin.github.io/cs-ontology-agent/explorer.html">온톨로지 탐색기</a>에서 볼 수 있어.`;
}
let LASTSEL = null;
function render(){
  const key = route.subj;
  renderTop(); renderFoot();
  const v = $('#view');
  v.innerHTML = route.view === 'quiz' ? renderQuiz() : route.view === 'lec' ? renderLec() : route.view === 'map' ? renderMap() : renderToday();

    // 폰에서는 지도 아래에 설명이 붙으니, 개념을 새로 고르면 그 설명으로 내려간다
    if(LASTSEL !== key + route.arg && window.innerWidth < 900){ const sd = $('#side'); if(sd) requestAnimationFrame(() => sd.scrollIntoView({block:'start'})); } }
  LASTSEL = route.view === 'map' && route.arg ? key + route.arg : null;
  if(route.view === 'lec' && route.arg && route.arg.includes('-')){ const el = document.getElementById('sc-' + route.arg); if(el) requestAnimationFrame(() => el.scrollIntoView({block:'start'})); }

function wire(v, key){
  v.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => startSession(key, b.dataset.start, b.dataset.arg)));
  v.querySelectorAll('[data-cid]').forEach(b => { if(b.tagName === 'BUTTON') b.addEventListener('click', () => go(`#/${key}/map/${b.dataset.cid}`)); });

  v.querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', () => { const st = store.load(key), sid = b.dataset.read; if(st.read[sid]) delete st.read[sid]; else st.read[sid] = now(); store.save(key); b.textContent = st.read[sid] ? '✓ 읽음' : '다 읽었어'; b.classList.toggle('pri', !st.read[sid]); }));

    try{ const id = await aiNewQuestion(key, +b.dataset.aigen); SES = {key, mode:'ai', title:`AI 문제 · ${cshort(key, +b.dataset.aigen)}`, pool:[id], queue:[id], max:1, used:new Set(), n:0, results:[], changes:[], probe:null, probeQ:0, probes:[], cur:null, phase:'q', note:null}; nextQuestion(); go(`#/${key}/quiz`); }
    catch(e){ b.textContent = aiErr(e); aiOff(e); } }));
  const r = $('#reset'); if(r) r.onclick = () => { if(RESET === key){ store.states[key] = emptyState(); store.save(key); RESET = null; if(SES && SES.key === key) SES = null; } else RESET = key; render(); };

    const q = S(key).data.quizzes[SES.cur.qid], text = (SES.text || '').trim(); if(!text) { ta.focus(); return; }

    if(q.kw && !AI.ok){ const k = SPEC.keywordScore(q.kw, text); SES.kwHit = k; return submitAnswer(k.correct); }

document.addEventListener('keydown', e => {

document.addEventListener('click', e => { const b = e.target.closest('[data-subj]'); if(b) go(`#/${b.dataset.subj}/${route.view}`); });
