<title>CS 개념 온톨로지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 헤더(정의·통계·스키마) → 도구줄 → [그래프 | 개념 카드] 2단, 폰에선 위아래 */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#16202C; --muted:#5F6B7A; --line:#D6DCE4; --grid:#E6EAF0;
  --anc:#2F62D0; --nxt:#1E8C5C; --sel:#16202C; --bad:#C2302B; --ok:#1E8C5C;
  --h5:#D9532C; --h5t:#FFFFFF; --h4:#EBA43A; --h4t:#1F1607; --h3:#3E8F95; --h3t:#FFFFFF;
  --h2:#9DB0C8; --h2t:#14202E; --h1:#D5DBE3; --h1t:#3A4655;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#151B23; --ink:#E4E9F0; --muted:#94A0AF; --line:#29313C; --grid:#1C232C;
  --anc:#7EA4FF; --nxt:#4FD19A; --sel:#F2F5F9; --bad:#FF7A70; --ok:#4FD19A;
  --h5:#E8663F; --h5t:#120804; --h4:#E9B04F; --h4t:#1B1304; --h3:#4FA8AE; --h3t:#06191A;
  --h2:#5C7290; --h2t:#EEF3F9; --h1:#2E3743; --h1t:#B9C3D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#151B23; --ink:#E4E9F0; --muted:#94A0AF; --line:#29313C; --grid:#1C232C;
  --anc:#7EA4FF; --nxt:#4FD19A; --sel:#F2F5F9; --bad:#FF7A70; --ok:#4FD19A;
  --h5:#E8663F; --h5t:#120804; --h4:#E9B04F; --h4t:#1B1304; --h3:#4FA8AE; --h3t:#06191A;
  --h2:#5C7290; --h2t:#EEF3F9; --h1:#2E3743; --h1t:#B9C3D0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(24px,3.4vw,34px);line-height:1.2;margin:2px 0 6px;font-weight:600;text-wrap:balance}
.lede{margin:0;max-width:68ch;color:var(--muted)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.schema{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line);padding-top:10px}
.schema i{font-style:normal;color:var(--ink)}
.schema em{font-style:normal;color:var(--anc)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--anc);outline-offset:1px}
.sugg{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;margin:0;list-style:none;box-shadow:0 8px 24px rgb(0 0 0 / .12)}
.sugg li button{all:unset;display:flex;gap:8px;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px}
.sugg li button:hover,.sugg li button:focus-visible{background:var(--grid)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--anc);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.ln{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:3px;margin-right:4px}
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(74vh,760px);min-height:420px}
.stage svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:18px 18px}
.stage svg:active{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.zoom button:focus-visible{outline:2px solid var(--anc)}
.cap{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:2px 6px;border-radius:6px}
.node rect{stroke:transparent;stroke-width:2}
.node text{font-size:12px;font-family:var(--font);pointer-events:none}
.node .num{font-family:var(--mono);font-size:10.5px;opacity:.75}
.node{cursor:pointer}
.node:focus-visible rect{stroke:var(--anc);stroke-width:3}
.h5 rect{fill:var(--h5)} .h5 text{fill:var(--h5t)}
.h4 rect{fill:var(--h4)} .h4 text{fill:var(--h4t)}
.h3 rect{fill:var(--h3)} .h3 text{fill:var(--h3t)}
.h2 rect{fill:var(--h2)} .h2 text{fill:var(--h2t)}
.h1 rect{fill:var(--h1)} .h1 text{fill:var(--h1t)}
.node.root rect{stroke:var(--ink);stroke-dasharray:4 3;stroke-width:1.5}
.node.sel rect{stroke:var(--sel);stroke-width:3;stroke-dasharray:none}
.node.next rect{stroke:var(--nxt);stroke-width:2.5;stroke-dasharray:5 3}
.edge{fill:none;stroke:var(--line);stroke-width:1.4}
.edge.anc{stroke:var(--anc);stroke-width:1.8}
.edge.nxt{stroke:var(--nxt);stroke-width:1.8;stroke-dasharray:5 4}
.dim{opacity:.16}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kick{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.stars{color:var(--h5);letter-spacing:1px}
.panel h2{margin:0;font-size:22px;line-height:1.3;font-weight:600;text-wrap:balance}
.panel h2 .num{font-family:var(--mono);font-weight:500;color:var(--muted);margin-right:8px;font-size:18px}
dl{margin:0;display:grid;gap:10px}
dt{font-size:12px;color:var(--muted);letter-spacing:.04em}
dd{margin:2px 0 0}
.exam{display:grid;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--h5)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.ref{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:3px 9px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)} .chip:focus-visible{outline:2px solid var(--anc);outline-offset:1px}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:5px}
.chip.a{border-color:color-mix(in srgb,var(--anc) 55%,var(--line))}
.chip.x{border-color:color-mix(in srgb,var(--nxt) 55%,var(--line))}
.path{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;padding-right:4px}
.lvl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.lvl>span{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:5px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.node.wrong rect{stroke:var(--bad);stroke-width:3.5;stroke-dasharray:none}
.node.gap rect{stroke:var(--sel);stroke-width:4;stroke-dasharray:none}
.node.known{opacity:.38}
.edge.path{stroke:var(--bad);stroke-width:2}
.diag{display:flex;flex-direction:column;gap:14px}
.diag textarea{width:100%;min-height:64px;font:inherit;font-family:var(--mono);font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.diag textarea:focus-visible{outline:2px solid var(--anc);outline-offset:1px}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--anc);outline-offset:2px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.step>b{font-family:var(--mono);font-weight:500;font-size:12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.step h3{margin-bottom:6px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:13.5px}
.cand .bar i{background:var(--anc)}
.ask{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.ask p{margin:0}
.review{margin:0;padding-left:20px;display:grid;gap:6px}
.review li{padding-left:2px}
.review .meta{font-size:12px;color:var(--muted)}
.trace{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:150px;overflow:auto;white-space:pre-wrap}
.answer{white-space:pre-wrap;font-size:14.5px;line-height:1.7}
.ex{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px;vertical-align:1px}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.stage{height:62vh;min-height:360px}.head{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.node rect,.edge{transition:opacity .2s}}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">독학사 통합컴퓨터시스템 · Knowledge Graph</div>
      <h1>CS 개념 온톨로지</h1>
      <p class="lede">문제집 200문항과 공식 평가영역을 개념 147개, 선행 관계 222개로 다시 엮은 지식 지도야. 개념을 하나 고르면 그걸 이해하는 데 필요한 선행 개념이 전부 거꾸로 펼쳐져.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="schema" id="schema" aria-label="온톨로지 스키마"></div>

  <div class="tools">
    <div class="search">
      <label for="q" class="eyebrow" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">개념 검색</label>
      <input id="q" type="search" placeholder="개념 이름이나 번호 (예: 인터럽트, 115)" autocomplete="off">
      <ul class="sugg" id="sugg" hidden></ul>
    </div>
    <div class="seg" role="group" aria-label="보기">
      <button id="vLine" aria-pressed="true">계보 보기</button>
      <button id="vMap" aria-pressed="false">전체 지도</button>
      <button id="vDiag" aria-pressed="false">오답 진단</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="main">
    <div class="stage">
      <svg id="svg" role="img" aria-label="개념 그래프"><defs>
        <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--anc)"/></marker>
        <marker id="mN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--nxt)"/></marker>
        <marker id="mD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--line)"/></marker>
      <marker id="mX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--bad)"/></marker>
      </defs><g id="scene"></g></svg>
      <div class="zoom"><button id="zi" aria-label="확대">+</button><button id="zo" aria-label="축소">−</button><button id="zf" aria-label="화면에 맞추기">⤢</button></div>
      <div class="cap" id="cap"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <footer id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>

const D = {"chapters":[{"id":1,"title":"컴퓨터의 뼈대","from":1,"to":2},{"id":2,"title":"0과 1로 숫자 표현하기","from":3,"to":5},{"id":3,"title":"계산하는 회로: 게이트와 조합회로","from":6,"to":14},{"id":4,"title":"숫자 계산과 코드","from":15,"to":23},{"id":5,"title":"기억하는 회로: 순차회로","from":24,"to":30},{"id":6,"title":"기억장치 부품","from":31,"to":33},{"id":7,"title":"CPU 만들기","from":34,"to":51},{"id":8,"title":"메모리가 느려서: 계층과 캐시","from":52,"to":59},{"id":9,"title":"보조기억장치","from":60,"to":62},{"id":10,"title":"느린 장치와 대화하기: 입출력","from":63,"to":70},{"id":11,"title":"프로그램이 실행되기까지: 시스템 SW","from":71,"to":77},{"id":12,"title":"OS의 등장과 프로세스","from":78,"to":83},{"id":13,"title":"누구부터 CPU를 줄까: 스케줄링","from":84,"to":93},{"id":14,"title":"같이 쓰면 생기는 문제: 동기화","from":94,"to":99},{"id":15,"title":"서로 기다리다 멈춤: 교착상태","from":100,"to":103},{"id":16,"title":"메모리를 나눠 쓰기","from":104,"to":117},{"id":17,"title":"디스크와 파일","from":118,"to":123},{"id":18,"title":"실제 OS: UNIX와 리눅스","from":124,"to":127},{"id":19,"title":"더 빠르게: 고성능·병렬","from":128,"to":131},{"id":20,"title":"특정 목적용: 임베디드","from":132,"to":134},{"id":21,"title":"하나를 여럿처럼: 가상머신","from":135,"to":141},{"id":22,"title":"지키기: 보안","from":142,"to":147}],"chains":[{"no":"①","name":"계산의 뿌리","steps":["트랜지스터 스위치","비트","부울 대수","게이트","가산기","ALU","CPU"]},{"no":"②","name":"기억의 뿌리","steps":["게이트 + 피드백","래치","(+클록) 플립플롭","레지스터·카운터·SRAM"]},{"no":"③","name":"2ⁿ의 사슬","steps":["n비트 = 2ⁿ가지","디코더 n","2ⁿ","MAR n비트","주소선 n개","캐시·페이지 주소 필드"]},{"no":"④","name":"음수의 사슬","steps":["2의 보수","뺄셈을 가산기로","오버플로","V 플래그"]},{"no":"⑤","name":"속도의 사슬","steps":["명령어 사이클","클록·CPI","성능 계산","파이프라인","해저드","RISC"]},{"no":"⑥","name":"메모리 속도 차이","steps":["계층","지역성","캐시","사상","쓰기 정책","(멀티코어) 캐시 일관성"]},{"no":"⑦","name":"장치 속도 차이","steps":["폴링","인터럽트","DMA","채널"]},{"no":"⑧","name":"실행의 사슬","steps":["소스","컴파일","어셈블","링크","로드","프로세스","PCB","상태 전이","스케줄링"]},{"no":"⑨","name":"공유의 사슬","steps":["스레드","경쟁 조건","임계구역","세마포어","(잘못 쓰면) 교착","예방·회피·탐지"]},{"no":"⑩","name":"공간의 사슬","steps":["분할","단편화","페이징","가상 메모리","페이지 부재","페이지 교체","스래 const depthMemo = new Map();
function depth(id){ if(depthMemo.has(id)) return depthMemo.get(id);
  const p = byId.get(id).prereq; const d = p.length ? 1 + Math.max(...p.map(depth)) : 0; depthMemo.set(id,d); return d; }
function ancestors(id, acc = new Set()){ for(const p of byId.get(id).prereq){ if(!acc.has(p)){ acc.add(p); ancestors(p, acc);} } return acc; }
function descendants(id, acc = new Set()){ for(const q of byId.get(id).next){ if(!acc.has(q)){ acc.add(q); descendants(q, acc);} } return acc; }

const svg = $('#svg'), scene = $('#scene');
let vb = {x:0,y:0,w:1000,h:600};
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const rect = () => svg.getBoundingClientRect();
function fit(b, mode){
  const r = rect(), pad = 24, padB = 44, ar = r.height / r.width;
  let w = b.w + pad*2, h = b.h + pad + padB;
  if(mode === 'width'){ w = Math.max(w, r.width / 1.25); h = w * ar; vb = {x:b.x - pad - (w - b.w - pad*2)/2, y:b.y - pad, w, h}; }
  else { if(h / w > ar) w = h / ar; else h = w * ar; vb = {x:b.x + b.w/2 - w/2, y:b.y - pad - (h - b.h - pad - padB)/2, w, h}; }
  setVB();
}
function zoomAt(f, cx, cy){ const nw = Math.min(Math.max(vb.w * f, 120), 9000); const k = nw / vb.w;

function toSvg(ev){ const r = rect(); return [vb.x + (ev.clientX - r.left) / r.width * vb.w, vb.y + (ev.clientY - r.top) / r.height * vb.h]; }
svg.addEventListener('wheel', e => { e.preventDefault(); const [x,y] = toSvg(e); zoomAt(e.deltaY > 0 ? 1.12 : 1/1.12, x, y); }, {passive:false});
const ptrs = new Map(); let pinch0 = 0, moved = 0;
svg.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, e); moved = 0; if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); } });
svg.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e);
  const r = rect(), s = vb.w / r.width;
  if(ptrs.size === 1){ const dx = e.clientX - prev.clientX, dy = e.clientY - prev.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if(moved > 4){ if(!svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId); vb.x -= dx*s; vb.y -= dy*s; setVB(); } }
  else if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if(pinch0){ const [cx,cy] = toSvg({clientX:(a.clientX+b.clientX)/2, clientY:(a.clientY+b.clientY)/2}); zoomAt(pinch0/d, cx, cy); } pinch0 = d; moved = 99; }
});
['pointerup','pointercancel','pointerleave'].forEach(t => svg.addEventListener(t, e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch0 = 0; }));

function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
function pathD(pts){ if(pts.length < 3) return `M${pts[0][0]},${pts[0][1]}L${pts[pts.length-1][0]},${pts[pts.length-1][1]}`;
  let d = `M${pts[0][0]},${pts[0][1]}`; for(let i=1;i<pts.length-1;i++){ const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2; d += `Q${pts[i][0]},${pts[i][1]} ${mx},${my}`; }
  const z = pts[pts.length-1]; return d + `L${z[0]},${z[1]}`; }
function drawNode(id, x, y, w, h, cls){
  const n = byId.get(id);
  const g = el('g', {class:`node h${n.stars}${n.root?' root':''} ${cls}`, transform:`translate(${x - w/2},${y - h/2})`, tabindex:0, role:'button', 'aria-label':`${id} ${n.title}`}, scene);
  el('rect', {width:w, height:h, rx:6}, g);
  const t = el('text', {x:10, y:h/2 + 4.5}, g);
  const a = el('tspan', {class:'num'}, t); a.textContent = id + ' ';
  const b = el('tspan', {}, t); b.textContent = short(id);
  g.addEventListener('click', () => { if(moved < 5) select(id); });
  g.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(id); } });
  return g;
}

let view = 'line', sel = 66;

      const toNext = e.from === sel && N.has(e.to);
      el('path', {d:pathD(e.pts), class:`edge${inLine?' anc':toNext?' nxt':''}${inLine||toNext?'':' dim'}`, 'marker-end':`url(#${inLine?'mA':toNext?'mN':'mD'})`}, scene);

    for(const e of es) g.setEdge(String(e.from), String(e.to));

    for(const e of es){ const toNext = e.from === sel && N.has(e.to);
      el('path', {d:pathD(g.edge(String(e.from), String(e.to)).points.map(p=>[p.x,p.y])), class:`edge ${toNext?'nxt':'anc'}`, 'marker-end':`url(#${toNext?'mN':'mA'})`}, scene); }
    for(const id of ids){ const p = g.node(String(id)); drawNode(id, p.x, p.y, p.width, p.height, id===sel?'sel':N.has(id)?'next':''); }
    const gi = g.graph(); fit({x:0, y:0, w:gi.width, h:gi.height}, gi.height > gi.width * 1.4 ? 'width' : 'all');

// ── 출제 문항 인덱스 (Concept ─tested_by→ ExamItem) ──
const itemIdx = new Map();
function expandRef(r){
  r = r.replace(/\(주관식\)/, '');
  let m = r.match(/^(\d{3})~(\d{3})$/); if(m){ const a = []; for(let i = +m[1]; i <= +m[2]; i++) a.push(String(i).padStart(3,'0')); return a; }
  m = r.match(/^(모의[12])-(\d+)~(\d+)$/); if(m){ const a = []; for(let i = +m[2]; i <= +m[3]; i++) a.push(`${m[1]}-${String(i).padStart(2,'0')}`); return a; }
  return [r];
}
for(const n of D.nodes) for(const r of n.exam.refs) for(const k of expandRef(r)){ if(!itemIdx.has(k)) itemIdx.set(k, new Set()); itemIdx.get(k).add(n.id); }
function normItem(raw){
  const t = String(raw).trim().replace(/\s+/g, ''); if(!t) return null; let m;
  if((m = t.match(/^(?:교재)?(\d{1,3})(?:번)?$/))){ const k = String(+m[1]).padStart(3,'0'); return {kind:'item', key:k, label:'교재 ' + k}; }
  if((m = t.match(/^모의([12])[-_.]?(\d{1,2})(?:번)?$/))){ const k = `모의${m[1]}-${String(+m[2]).padStart(2,'0')}`; return {kind:'item', key:k, label:k}; }
  if((m = t.match(/^(?:공식)?예시0?(\d)$/))){ const k = `공식 예시0${m[1]}`; return {kind:'item', key:k, label:k}; }
  if((m = t.match(/^[#cC](\d{1,3})$/)) && byId.has(+m[1])) return {kind:'concept', id:+m[1], label:'개념 ' + m[1]};
  const hit = D.nodes.find(n => n.title.replace(/\s/g,'').includes(t));
  if(hit) return {kind:'concept', id:hit.id, label:hit.title};
  return {kind:'none', label:String(raw).trim()};
}
function tokenize(s){ return s.split(/[,\n]+/).flatMap(ch => /^[\s\d모의\-_.#cC예시공식교재번]+$/.test(ch) ? ch.trim().split(/\s+/) : [ch.trim()]).filter(Boolean); }

// ── 진단 추론 ──
const ancMemo = new Map(); const anc = id => { if(!ancMemo.has(id)) ancMemo.set(id, ancestors(id)); return ancMemo.get(id); };
function closure(set){ const s = new Set(); for(const k of set){ s.add(k); for(const a of anc(k)) s.add(a); } return s; }
function rankShared(W, exclude = new Set()){
  const cov = new Map();
  for(const w of W) for(const a of anc(w)) if(!exclude.has(a) && !W.includes(a)) cov.set(a, (cov.get(a) || 0) + 1);
  const c = [...cov.keys()];
  const front = c.filter(a => !c.some(b => b !== a && cov.get(b) >= cov.get(a) && anc(b).has(a)));
  return front.map(a => ({id:a, cov:cov.get(a), depth:depth(a)})).sort((x,y) => y.cov - x.cov || y.depth - x.depth || byId.get(y.id).stars - byId.get(x.id).stars);
}
const EXAMPLE = '056 093 065 113';
const MAXQ = 6;
let dg = null;
function diagnose(text){
  const toks = tokenize(text), items = [], W = [];
  for(const t of toks){ const r = normItem(t); if(!r) continue;
    const ids = r.kind === 'item' ? [...(itemIdx.get(r.key) || [])] : r.kind === 'concept' ? [r.id] : [];
    items.push({...r, ids}); for(const i of ids) if(!W.includes(i)) W.push(i); }
  W.sort((a,b) => a - b);
  dg = {text, items, W, known:new Set(), gaps:new Set(), asked:[], done:false};
  dg.q = nextQuestion(); if(dg.q == null) dg.done = true;
}
function nextQuestion(){
  if(!dg || dg.asked.length >= MAXQ) return null;
  const askedIds = new Set(dg.asked.map(a => a.id)), kc = closure(dg.known);
  const deeper = [...dg.gaps].flatMap(g => byId.get(g).prereq).filter(p => !askedIds.has(p) && !kc.has(p) && !dg.W.includes(p))
    .sort((a,b) => byId.get(b).stars - byId.get(a).stars || depth(b) - depth(a));
  if(deeper.length) return deeper[0];
  const r = rankShared(dg.W, new Set([...kc, ...askedIds]));
  const pick = r.find(c => !askedIds.has(c.id) && !kc.has(c.id));
  return pick ? pick.id : null;
}
function answer(id, ans){ dg.asked.push({id, ans}); if(ans === 'know') dg.known.add(id); if(ans === 'gap') dg.gaps.add(id); dg.q = nextQuestion(); if(dg.q == null) dg.done = true; }
function result(){
  const gaps = [...dg.gaps];
  let roots = gaps.filter(g => !gaps.some(h => h !== g && anc(g).has(h)));
  const direct = roots.length === 0;
  if(direct) roots = dg.W.slice();
  const path = new Set();
  for(const r of roots) for(const w of dg.W){ if(r === w){ path.add(r); continue; } if(!anc(w).has(r)) continue;
    path.add(r); path.add(w); for(const x of anc(w)) if(anc(x).has(r)) path.add(x); }
  for(const w of dg.W) path.add(w);
  const kc = closure(dg.known);
  const order = [...path].filter(x => !kc.has(x) || dg.W.includes(x) || dg.gaps.has(x)).sort((a,b) => depth(a) - depth(b) || a - b);
  return {roots, order, direct, all:[...path]};
}
function diagNodes(){
  if(!dg || !dg.W.length) return new Set();
  const show = new Set(dg.W);
  if(dg.done){ for(const x of result().all) show.add(x); return show; }
  const top = rankShared(dg.W).slice(0, 5).map(c => c.id).concat([...dg.gaps], dg.q != null ? [dg.q] : []);
  for(const c of top){ show.add(c); for(const w of dg.W) if(anc(w).has(c)) for(const x of anc(w)) if(anc(x).has(c)) show.add(x); }
  return show;
}

function aiTools(log){

      const r = rankShared(dg.W).slice(0, 5);
      h += `<div class="step"><b>2</b><div><h3>여러 문제가 같이 기대는 선행 개념</h3><div style="display:grid;gap:6px">${r.map(c => `<div class="cand"><button class="chip a" data-id="${c.id}"><span class="n">${c.id}</span>${short(c.id)}</button><div class="bar" role="img" aria-label="${dg.W.length}개 중 ${c.cov}개가 공유"><i style="width:${c.cov / dg.W.length * 100}%"></i></div></div>`).join('')}</div>
        <p class="note" style="margin-top:6px">막대 = 틀린 개념 ${dg.W.length}개 중 몇 개가 이 개념을 거쳐 가는지</p></div></div>`;
      h += `<div class="step"><b>3</b><div><h3>확인 질문 · ${dg.asked.length}/${MAXQ}</h3>`;
      if(dg.q != null && !dg.done){ const n = byId.get(dg.q);
        h += `<div class="ask"><p><span class="ref">${n.id}</span> <b>${n.title}</b></p><p class="note">${n.why}</p><p>이 개념, 남한테 설명할 수 있어?</p>
          <div class="row"><button class="btn" data-ans="know">설명할 수 있어</button><button class="btn ghost" data-ans="gap">헷갈려</button><button class="btn ghost" data-ans="skip">모르겠어, 넘어가</button></div></div>`;
      } else h += `<p class="note">${dg.asked.length ? '질문 끝.' : '물어볼 선행 개념이 없어.'}</p>`;
      if(dg.asked.length) h += `<p class="note" style="margin-top:6px">${dg.asked.map(a => `${a.id} ${a.ans === 'know' ? '✓' : a.ans === 'gap' ? '✗' : '–'}`).join(' · ')}</p>`;
      if(!dg.done && dg.asked.length) h += `<div class="row" style="margin-top:6px"><button class="btn ghost" id="dFin">여기까지로 결과 보기</button></div>`;
      h += `</div></div>`;
      if(dg.done){ const R = result();
        h += `<div class="step"><b>4</b><div><h3>${R.direct ? '선행은 괜찮아. 틀린 개념 자체를 다시 봐' : '진짜 막힌 지점'}</h3>${chips(R.roots, 'x')}
          <h3 style="margin-top:10px">복습 순서 · ${R.order.length}단계</h3><ol class="review">${R.order.map(i => { const n = byId.get(i); return `<li><button class="chip ${dg.W.includes(i) ? '' : 'a'}" data-id="${i}"><span class="n">${i}</span>${short(i)}</button> <span class="meta">${'★'.repeat(n.stars)} · ${n.chapter}장${dg.W.includes(i) ? ' · 틀린 문제' : ''}</span></li>`; }).join('')}</ol></div></div>`;
      }
      h += `<div id="aiBox" hidden><div class="step"><b>AI</b><div><h3>AI 코치 (Claude가 온톨로지 도구를 직접 호출)</h3>
        <p class="note">Claude에 로그인한 사람만 쓸 수 있어. 처음 누르면 허용할지 물어보고, 누른 사람의 Claude 사용량을 써.</p>
        <div class="row" style="margin:8px 0"><button class="btn" id="aiRun">AI 코치에게 진단 설명 듣기</button><button class="btn ghost" id="aiStop" hidden>멈추기</button></div>
        <div class="trace" id="aiTrace" hidden aria-label="도구 호출 기록"></div><div class="answer" id="aiOut"></div></div></div></div>`;
    }
  }
  h += `</div>`;
  P.innerHTML = h;
  $('#dRun').onclick = () => { diagnose($('#dIn').value); render(true); diagPanel(); };
  $('#dEx').onclick = () => { diagnose(EXAMPLE); render(true); diagPanel(); };
  P.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => { answer(dg.q, b.dataset.ans); render(true); diagPanel(); });
  const fin = $('#dFin'); if(fin) fin.onclick = () => { dg.done = true; dg.q = null; render(true); diagPanel(); };
  P.querySelectorAll('.chip').forEach(b => b.onclick = () => select(+b.dataset.id));
  const ai = $('#aiRun'); if(ai){ ai.onclick = runAI; $('#aiStop').onclick = () => aiCtl && aiCtl.abort(); sampleP.then(s => { const box = $('#aiBox'); if(box) box.hidden = !s; }); }
}
function renderDiag(){
  if(!dg) diagnose(EXAMPLE);
  const ids = [...diagNodes()];
  if(!ids.length || typeof dagre === 'undefined'){ $('#cap').textContent = '진단할 개념이 아직 없어.'; return; }
  const set = new Set(ids), R = dg.done ? result() : null, onPath = R ? new Set(R.order) : null;
  const g = new dagre.graphlib.Graph(); g.setGraph({rankdir:'TB', nodesep:12, ranksep:30, marginx:10, marginy:10}); g.setDefaultEdgeLabel(() => ({}));
  for(const id of ids){ const p = L.pos[id]; g.setNode(String(id), {width:p.w + 26, height:p.h}); }
  const es = D.edges.filter(e => set.has(e.from) && set.has(e.to));
  for(const e of es) g.setEdge(String(e.from), String(e.to));
  dagre.layout(g);
  for(const e of es){ const hot = onPath && onPath.has(e.from) && onPath.has(e.to);
    el('path', {d:pathD(g.edge(String(e.from), String(e.to)).points.map(p => [p.x, p.y])), class:`edge ${hot ? 'path' : 'anc'}`, 'marker-end':`url(#${hot ? 'mX' : 'mA'})`}, scene); }
  const kc = closure(dg.known);
  for(const id of ids){ const p = g.node(String(id));
    const cls = dg.W.includes(id) ? 'wrong' : dg.gaps.has(id) ? 'gap' : (R && R.roots.includes(id)) ? 'gap' : kc.has(id) ? 'known' : id === dg.q ? 'sel' : '';
    const node = drawNode(id, p.x, p.y, p.width, p.height, cls);
    const mark = dg.W.includes(id) ? '✗ ' : dg.gaps.has(id) ? '? ' : kc.has(id) ? '✓ ' : '';
    if(mark){ const ts = node.querySelector('tspan'); ts.textContent = mark + ts.textContent; } }
  const gi = g.graph(); fit({x:0, y:0, w:gi.width, h:gi.height}, gi.height > gi.width * 1.4 ? 'width' : 'all');
  $('#cap').textContent = dg.done ? '빨간 선 = 복습 경로 · ✗ 틀린 문제의 개념 · 굵은 테두리 = 막힌 지점' : '✗ 틀린 문제의 개념 · ✓ 설명 가능 · ? 헷갈림 · 굵은 테두리 = 지금 묻는 개념';
}

// ── 개념 카드 ──
function chips(list, cls){ return `<div class="chips">${list.map(id => `<button class="chip ${cls}" data-id="${id}"><span class="n">${id}</span>${short(id)}</button>`).join('')}</div>`; }
function panel(){
  if(view === 'diag') return diagPanel();
  const n = byId.get(sel), c = chap.get(n.chapter), A = [...ancestors(sel)];
  const lv = new Map(); for(const a of A){ const d = depth(a); if(!lv.has(d)) lv.set(d, []); lv.get(d).push(a); }
  const levels = [...lv.keys()].sort((a,b)=>a-b);
  const desc = descendants(sel).size;
  $('#panel').innerHTML = `
    <div class="kick"><span>${c.id}장 ${c.title}</span><span class="stars" aria-label="중요도 ${n.stars}">${'★'.repeat(n.stars)}${'☆'.repeat(5-n.stars)}</span><span>${LABEL[n.stars]}</span>${n.root?'<span>· 뿌리 개념</span>':''}</div>
    <h2><span class="num">${n.id}</span>${n.title}</h2>
    <dl><div><dt>왜 생겼나</dt><dd>${n.why}</dd></div><div><dt>핵심</dt><dd>${n.core}</dd></div>${n.calc?`<div><dt>계산 이유</dt><dd>${n.calc}</dd></div>`:''}</dl>
    <div class="exam"><h3>출제</h3>${n.exam.prob!=null?`<div class="bar" role="img" aria-label="출제 확률 ${n.exam.prob}%"><i style="width:${n.exam.prob}%"></i></div><div class="row"><span class="tag">확률 ${n.exam.prob}% (추정)</span>${n.exam.types.map(t=>`<span class="tag">${TYPES[t]}</span>`).join('')}</div>`:`<p class="note">${n.exam.raw}</p>`}
      ${n.exam.refs.length?`<div class="ref">근거 ${n.exam.refs.join(' · ')}</div>`:''}</div>
    <div><h3>바로 앞 개념 · ${n.prereq.length}</h3>${n.prereq.length?chips(n.prereq,'a'):'<p class="note">출발점이야. 선행 개념이 없어.</p>'}</div>
    <div><h3>바로 열리는 개념 · ${n.next.length}</h3>${n.next.length?chips(n.next,'x'):'<p class="note">가지 끝이야.</p>'}</div>
    <div><h3>여기까지 오는 길 · 선행 ${A.length}개</h3><p class="note">${n.id}번을 이해하려면 아래를 위에서부터 알아야 해. 뒤로 열리는 개념은 모두 ${desc}개.</p>
      <div class="path">${levels.map(d=>`<div class="lvl"><span>L${d}</span>${chips(lv.get(d).sort((a,b)=>a-b),'a')}</div>`).join('') || '<p class="note">없음</p>'}</div></div>`;
  $('#panel').querySelectorAll('.chip').forEach(b => b.onclick = () => select(+b.dataset.id));
}

function select(id){ if(!byId.has(id)) return; sel = id; if(view === 'diag'){ view = 'line'; syncSeg(); } try{ history.replaceState(null,'','#c'+id); }catch(e){ location.hash = 'c'+id; } render(view === 'line'); panel(); }
function syncSeg(){ $('#vLine').setAttribute('aria-pressed', view==='line'); $('#vMap').setAttribute('aria-pressed', view==='map'); $('#vDiag').setAttribute('aria-pressed', view==='diag'); }
function setView(v){ view = v; syncSeg(); try{ history.replaceState(null,'', v==='diag' ? '#diag' : '#c'+sel); }catch(e){} render(true); panel(); }
$('#vLine').onclick = () => setView('line'); $('#vMap').onclick = () => setView('map'); $('#vDiag').onclick = () => setView('diag');

// ── 검색 ──
const q = $('#q'), sugg = $('#sugg');
q.addEventListener('input', () => {
  const s = q.value.trim(); if(!s){ sugg.hidden = true; return; }
  const num = /^\d+$/.test(s) ? +s : null;
  const hits = D.nodes.filter(n => n.id === num || n.title.includes(s) || n.core.includes(s)).sort((a,b)=>(b.title.includes(s)) - (a.title.includes(s)) || b.stars - a.stars).slice(0,8);
  sugg.innerHTML = hits.map(n => `<li><button data-id="${n.id}"><span class="ref">${n.id}</span>${n.title}</button></li>`).join('') || '<li class="note" style="padding:6px 8px">찾는 개념이 없어. 다른 낱말로 검색해 봐.</li>';
  sugg.hidden = false; sugg.querySelectorAll('button').forEach(b => b.onclick = () => { select(+b.dataset.id); q.value=''; sugg.hidden = true; });
});
q.addEventListener('keydown', e => { if(e.key === 'Enter'){ const b = sugg.querySelector('button'); if(b) b.click(); } if(e.key === 'Escape') sugg.hidden = true; });
document.addEventListener('click', e => { if(!e.target.closest('.search')) sugg.hidden = true; });

window.addEventListener('resize', () => render(true));
window.addEventListener('hashchange', () => { const m = location.hash.match(/^#c(\d+)$/); if(m && +m[1] !== sel) select(+m[1]); });
const m0 = location.hash.match(/^#c(\d+)$/); if(m0 && byId.has(+m0[1])) sel = +m0[1];
if(location.hash === '#diag'){ view = 'diag'; syncSeg(); }
render(true); panel();
</script>
